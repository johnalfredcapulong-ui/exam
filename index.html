<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Conversion Exam</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="container">
        <h1>Exam Login</h1>
        <p>Please enter your unique passcode to begin.</p>
        <form id="login-form">
            <input type="text" id="passcode-input" placeholder="Enter Passcode (e.g., STUDENT01)" required autocomplete="off">
            <button type="submit" id="login-btn">Start Exam</button>
        </form>
        <p id="login-error" class="error-msg"></p>
    </div>

    <!-- EXAM SCREEN -->
    <div id="exam-screen" class="container hidden">
        <div class="header">
            <h2>Welcome, <span id="student-name-display"></span></h2>
            <div class="score-board">Score: <span id="current-score">0</span></div>
        </div>
        <div id="question-area">
            <h3 id="question-text">Loading...</h3>
            <p id="question-instruction" class="instruction-text"></p>
            <form id="answer-form">
                <input type="text" id="answer-input" placeholder="Your answer..." autocomplete="off" required>
                <button type="submit" id="submit-answer-btn">Submit Answer</button>
            </form>
            <p id="feedback-msg" class="feedback"></p>
        </div>
    </div>

    <!-- COLOR GAME SCREEN -->
    <div id="color-game-screen" class="container hidden">
        <h1>Color Match Challenge</h1>
        <p>Match the target color on the left by adjusting the RGB sliders on the right.</p>
        
        <div class="color-game-container">
            <div class="color-box-wrapper">
                <p>Target Color</p>
                <div id="target-color-box" class="color-box"></div>
            </div>
            
            <div class="color-box-wrapper">
                <p>Your Color</p>
                <div id="user-color-preview" class="color-box"></div>
            </div>
        </div>

        <div class="sliders-container">
            <div class="slider-group">
                <label for="red-slider">Red: <span id="red-val">128</span></label>
                <input type="range" id="red-slider" min="0" max="255" value="128">
            </div>
            <div class="slider-group">
                <label for="green-slider">Green: <span id="green-val">128</span></label>
                <input type="range" id="green-slider" min="0" max="255" value="128">
            </div>
            <div class="slider-group">
                <label for="blue-slider">Blue: <span id="blue-val">128</span></label>
                <input type="range" id="blue-slider" min="0" max="255" value="128">
            </div>
        </div>

        <button id="submit-color-btn">Submit Color</button>
        
        <div id="color-result" class="hidden">
            <h2 id="color-score-display"></h2>
            <p id="color-final-msg"></p>
        </div>
    </div>

    <!-- FINAL COMPLETION MODAL -->
    <div id="completion-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Exam Completed</h2>
            <p id="modal-summary-text">Your results have been recorded.</p>
            <button id="close-modal-btn">Close</button>
        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
</body>
</html>
